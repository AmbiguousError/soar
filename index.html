<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Pastel Glider</title>
    <style>
        body, html {
            background-color: #000;
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; /* Prevents scrollbars */
            display: flex;
            justify-content: center;
            align-items: center;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 75vw; /* 4:3 Aspect Ratio */
            max-height: 100vh;
            max-width: 133.33vh; /* 4:3 Aspect Ratio */
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        canvas {
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas" width="1200" height="900"></canvas>
    </div>
    <script src="config.js"></script>
    <script src="sprites.js"></script>
    <script src="mapGeneration.js"></script>
    <script src="ui.js"></script>
    <script src="gameStateManager.js"></script>
    <script src="game.js"></script>
</body>
</html>
